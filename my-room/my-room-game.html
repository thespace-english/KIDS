:root {
  --mint: #dff8f1;
  --mint2: #eefcf8;
  --ink: #27463f;
  --accent: #6ea99a;
  --accent-dark: #548d7f;
  --good: #2f9d71;
  --bad: #d34f4f;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Nunito, Arial, sans-serif;
  background: linear-gradient(135deg, var(--mint), var(--mint2));
  color: var(--ink);
}

button {
  font-family: inherit;
}

/* ---------------- MAIN ---------------- */

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.badge {
  background: white;
  padding: 9px 14px;
  border-radius: 18px;
  font-weight: 800;
  box-shadow: 0 6px 20px rgba(40, 80, 70, .12);
}

.panel {
  background: rgba(255,255,255,.90);
  padding: 17px;
  border-radius: 28px;
  box-shadow: 0 18px 45px rgba(40, 80, 70, .15);
}

/* ---------------- BOARD ---------------- */

.board-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1536 / 1024;
  overflow: hidden;
  border-radius: 22px;
}

.board {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.token {
  position: absolute;

  width: 36px;
  height: 36px;

  transform: translate(-50%, -50%);

  border-radius: 50%;
  background: #ef3c27;

  border: 4px solid white;

  box-shadow:
    0 4px 10px rgba(0,0,0,.35);

  transition:
    left .45s ease,
    top .45s ease;

  z-index: 10;
}

/* ---------------- DICE ---------------- */

.game-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  margin-top: 16px;
}

.die {
  width: 78px;
  height: 78px;

  display: grid;
  place-items: center;

  background: white;

  border-radius: 20px;

  font-size: 44px;

  box-shadow:
    0 8px 20px rgba(40,80,70,.18);
}

.die.rolling {
  animation: diceRoll .28s linear infinite;
}

@keyframes diceRoll {
  0% {
    transform: rotate(0deg) scale(1);
  }

  50% {
    transform: rotate(180deg) scale(1.15);
  }

  100% {
    transform: rotate(360deg) scale(1);
  }
}

.main-button {
  border: none;

  padding: 15px 28px;

  border-radius: 18px;

  background: var(--accent);
  color: white;

  font-size: 20px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 20px rgba(40,80,70,.18);
}

.main-button:hover {
  background: var(--accent-dark);
}

.main-button:disabled {
  opacity: .45;
  cursor: default;
}

.reset-button {
  border: none;

  background: white;

  border-radius: 15px;

  padding: 12px 18px;

  font-size: 15px;
  font-weight: 800;

  color: var(--ink);

  cursor: pointer;
}

.status {
  text-align: center;

  min-height: 30px;

  margin-top: 10px;

  font-size: 19px;
  font-weight: 900;
}

/* ---------------- MODALS ---------------- */

.modal {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 18px;

  background: rgba(31, 67, 59, .43);

  z-index: 100;
}

.modal.show {
  display: flex;
}

.game-card {
  width: min(940px, 97vw);
  max-height: 94vh;

  overflow-y: auto;

  padding: 24px;

  background: #f9fffd;

  border-radius: 28px;

  box-shadow:
    0 24px 65px rgba(0,0,0,.26);
}

/* ---------------- INTRO ---------------- */

.intro-title {
  text-align: center;

  font-size: 28px;
  font-weight: 900;

  margin-bottom: 18px;
}

.example {
  background: white;

  border-radius: 20px;

  padding: 15px 20px;

  margin: 12px 0;

  font-size: 22px;
  line-height: 1.55;

  box-shadow:
    0 6px 18px rgba(40,80,70,.10);
}

.highlight {
  padding: 1px 6px;

  background: #fff0a4;

  border-radius: 7px;

  font-weight: 900;
}

.play-wrap {
  display: flex;
  justify-content: center;

  margin-top: 22px;
}

.play-button {
  border: none;

  border-radius: 20px;

  padding: 15px 38px;

  background: var(--accent);

  color: white;

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;
}

/* ---------------- SCENE ---------------- */

.scene {
  display: flex;

  justify-content: center;
  align-items: center;

  min-height: 245px;

  transition: gap .8s ease;
}

/* В первом раунде очень явно близко */
.scene.near {
  gap: 0;
}

/* Далеко должно быть визуально очевидно */
.scene.far {
  gap: 340px;
}

.avatar {
  width: 200px;
  height: 215px;

  object-fit: contain;
}

.object {
  width: 190px;
  height: 190px;

  object-fit: contain;
}

.pair {
  display: flex;
  align-items: center;

  gap: 3px;
}

.pair .avatar {
  width: 155px;
}

/* ---------------- TASK 1 ---------------- */

.task-title {
  margin: 4px 0 14px;

  text-align: center;

  font-size: 25px;
  font-weight: 900;
}

.answer-zone {
  display: flex;
  align-items: center;
  flex-wrap: wrap;

  gap: 8px;

  min-height: 64px;

  padding: 10px;

  background: white;

  border: 2px dashed #78b4a5;
  border-radius: 18px;
}

.word-bank {
  display: flex;

  justify-content: center;
  flex-wrap: wrap;

  gap: 10px;

  margin: 13px 0;
}

.word {
  padding: 10px 15px;

  background: #eaf8f4;

  border: 2px solid #b9dfd5;
  border-radius: 14px;

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;

  user-select: none;
}

.word:hover {
  transform: translateY(-1px);
}

/* ---------------- ACTIONS ---------------- */

.action-row {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 14px;

  margin: 12px 0;
}

.undo-button {
  width: 52px;
  height: 46px;

  border: none;

  background: white;

  border-radius: 15px;

  font-size: 29px;
  font-weight: 900;

  color: var(--ink);

  cursor: pointer;

  box-shadow:
    0 7px 18px rgba(40,80,70,.12);
}

.check-button {
  border: none;

  padding: 12px 23px;

  border-radius: 15px;

  background: var(--accent);

  color: white;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

.feedback {
  min-height: 28px;

  text-align: center;

  font-size: 19px;
  font-weight: 900;
}

.feedback.good {
  color: var(--good);
}

.feedback.bad {
  color: var(--bad);
}

/* ---------------- TASK 2 ---------------- */

.step2 {
  display: none;

  margin-top: 18px;
}

.step2.show {
  display: block;
}

.correct-sentence {
  text-align: center;

  font-size: 23px;
  font-weight: 900;

  color: var(--good);

  margin: 8px 0 5px;
}

.down-arrow {
  text-align: center;

  font-size: 38px;

  line-height: 1;

  margin: 8px 0;
}

.replace-sentence {
  display: flex;

  justify-content: center;
  align-items: center;
  flex-wrap: wrap;

  gap: 9px;

  font-size: 23px;
  font-weight: 900;

  margin: 10px 0;
}

.pronoun-options {
  display: flex;

  justify-content: center;
  gap: 10px;

  margin: 12px 0;
}

.pronoun-button {
  border: 2px solid #b5ddd3;

  border-radius: 15px;

  padding: 10px 17px;

  background: #eaf8f4;

  color: var(--ink);

  font-size: 18px;
  font-weight: 900;

.pronoun-button.selected {

.pronoun-button.correct {

  color: #247a58;

.pronoun-button.wrong {

  border-color: var(--bad);

.next-wrap {

  justify-content: center;

  margin-top: 15px;

.next-button {

  height: 58px;

  border-radius: 18px;

  background: var(--accent);

  color: white;

  line-height: 1;

.next-button.show {

.tip {
  text-align: center;

  margin-top: 8px;

  font-size: 14px;

  }

  .avatar {

    height: 155px;
  }

  .object {
    width: 125px;
    height: 125px;
  }

  .pair .avatar {
    width: 100px;
  }

  .word {
    font-size: 15px;
  }

  .replace-sentence {
    font-size: 19px;
  }
}
</style>

function sleep(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );

}


function shuffle(array) {

  return array
    .map(value => ({
      value,
      sort: Math.random()
    }))
    .sort((a, b) =>
      a.sort - b.sort
    )
    .map(item =>
      item.value
    );

}


function normalize(text) {

  return text

    .replace(/\s+/g, " ")

    .replace(/\s+'\s*s/g, "'s")

    .replace(/[.!?]+$/, "")

    .trim()

    .toLowerCase();

}


function pluralTrap(noun) {

  if (noun === "TV") {
    return "TVs";
  }

  if (noun.endsWith("y")) {
    return noun.slice(0, -1) + "ies";
  }

  if (noun.endsWith("s")) {
    return noun + "es";
  }

  return noun + "s";

}


function possessiveTrap(noun) {

  return noun + "'s";

}


function ownerPossessive(names) {

  if (names.length === 1) {

    return `${names[0]}'s`;

  }

  return `${names[0]} and ${names[1]}'s`;

}


function ownerPlain(names) {

  if (names.length === 1) {

    return names[0];

  }

  return `${names[0]} and ${names[1]}`;

}

  die.classList.add("rolling");

  for (let i = 0; i < 13; i++) {

    die.textContent =
      faces[
        Math.floor(
          Math.random() * 6
        )
      ];

    await sleep(70);

  }

  die.textContent =
    faces[finalNumber - 1];

  die.classList.remove("rolling");

}


/* =========================================================
   MOVEMENT
========================================================= */

async function moveBy(number) {

  const direction =
    Math.sign(number);

  for (
    let i = 0;
    i < Math.abs(number);
    i++
  ) {

    pos += direction;

    pos = Math.max(
      0,
      Math.min(
        cells.length - 1,
        pos
      )
    );

    placeToken();

    /*
      Фишка идёт достаточно медленно,
      чтобы ребёнок видел каждый шаг.
    */
    await sleep(550);

    if (
      pos === cells.length - 1
    ) {
      break;
    }

  }

}


/* =========================================================
   CELL ACTION
========================================================= */

async function resolveCell() {

  const cell =
    cells[pos];


  /* ---------- BOOM ---------- */

  if (
    cell.type === "boom"
  ) {

    statusEl.textContent =
      "BOOM! −2";

    await sleep(900);

    await moveBy(-2);

    return resolveCell();

  }


  /* ---------- WOW ---------- */

  if (
    cell.type === "wow"
  ) {

    statusEl.textContent =
      "WOW! +2";

    await sleep(900);

    await moveBy(2);

    return resolveCell();

  }


  /* ---------- FINISH ---------- */

  if (
    cell.type === "finish"
  ) {

    statusEl.textContent =
      "FINISH! ★";

    rollBtn.disabled = true;

    return;

  }


  /* ---------- OBJECT ---------- */

  if (
    cell.type !== "start"
  ) {

    statusEl.textContent =
      "Your task!";

    await sleep(500);

    openTask(cell);

    return;

  }


  busy = false;

  rollBtn.disabled = false;

}


/* =========================================================
   START / ROLL
========================================================= */

rollBtn.addEventListener(
  "click",
  async () => {

    if (busy) {
      return;
    }

    busy = true;

    rollBtn.disabled = true;

    rollBtn.textContent =
      "ROLL DICE";


    const number =
      rollDie();


    statusEl.textContent =
      "Rolling...";


    await animateDie(number);


    /*
      Сначала ребёнок видит,
      какое число выпало.
    */

    statusEl.textContent =
      `You rolled ${number}`;


    await sleep(1200);


    /*
      И только потом
      начинает двигаться фишка.
    */

    await moveBy(number);


    await resolveCell();


    if (
      !taskModal.classList.contains("show")
      &&
      pos !== cells.length - 1
    ) {

      busy = false;

      rollBtn.disabled = false;

    }

  }
);


/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    pos = 0;

    busy = false;

    taskCount = 0;

    rollBtn.disabled = false;

    rollBtn.textContent =
      "START";

    die.textContent =
      "🎲";

    statusEl.textContent =
      "Press START!";

    placeToken();

  }
);


/* =========================================================
   INTRO
========================================================= */

playBtn.addEventListener(
  "click",
  () => {

    introModal.classList.remove(
      "show"
    );

  }
);


/* =========================================================
   PEOPLE IMAGE
========================================================= */

function renderPeople(person) {

  peopleArea.innerHTML = "";


  if (
    person.files.length === 1
  ) {

    const image =
      document.createElement("img");

    image.src =
      AVATAR(
        person.files[0]
      );

    image.className =
      "avatar";

    peopleArea.appendChild(
      image
    );

    return;

  }


  const pair =
    document.createElement("div");

  pair.className =
    "pair";


  person.files.forEach(
    file => {

      const image =
        document.createElement("img");

      image.src =
        AVATAR(file);

      image.className =
        "avatar";

      pair.appendChild(
        image
      );

    }
  );


  peopleArea.appendChild(
    pair
  );

}


/* =========================================================
   WORD BANK
========================================================= */

function addWordCard(
  word,
  container
) {

  const element =
    document.createElement("button");

  element.type =
    "button";

  element.className =
    "word";

  element.textContent =
    word;


  element.addEventListener(
    "click",
    () => {

      /*
        Слово переносится
        из банка в предложение.
      */

      answer1.appendChild(
        element
      );

    }
  );


  container.appendChild(
    element
  );

}


function buildWordBank(words) {

  bank1.innerHTML = "";

  answer1.innerHTML = "";


  shuffle(words)
    .forEach(word => {

      addWordCard(
        word,
        bank1
      );

    });

}


/* =========================================================
   ANSWER
========================================================= */

function getAnswerText() {

  return [
    ...answer1.children
  ]

    .map(element =>
      element.textContent
    )

    .join(" ")

    .trim();

}


/* =========================================================
   UNDO
========================================================= */

undo1.addEventListener(
  "click",
  () => {

    const last =
      answer1.lastElementChild;


    if (!last) {
      return;
    }


    /*
      Отменяем только
      последнее выбранное слово.
    */

    bank1.appendChild(
      last
    );

  }
);


/* =========================================================
   OPEN TASK
========================================================= */

function openTask(cell) {

  const person =
    people[
      Math.floor(
        Math.random()
        *
        people.length
      )
    ];


  /*
    Первый раунд всегда near.
    Потом расстояние меняется
    каждый следующий раунд.
  */

  const near =
    taskCount % 2 === 0;

  taskCount++;


  const demonstrative =
    near
      ? "This"
      : "That";


  const noun =
    objectWords[
      cell.type
    ];


  const possessive =
    ownerPossessive(
      person.names
    );


  const pronoun =
    person.pronoun;


  current = {

    demonstrative,

    noun,

    possessive,

    pronoun,

    person,

    answer:
      `${demonstrative} is ${possessive} ${noun}.`

  };


  /* ---------- IMAGES ---------- */

  renderPeople(
    person
  );


  objectImg.src =
    ASSET(
      cell.file
    );


  scene.className =
    near
      ? "scene near"
      : "scene far";


  /* ---------- WORDS ---------- */

  const words = [

    "This",

    "That",

    "is",

    possessive,

    ownerPlain(
      person.names
    ),

    noun,

    pluralTrap(
      noun
    ),

    possessiveTrap(
      noun
    )

  ];


  buildWordBank(
    words
  );


  /* ---------- RESET TASK ---------- */

  feedback1.textContent = "";

  feedback1.className =
    "feedback";


  feedback2.textContent = "";

  feedback2.className =
    "feedback";

  step1.style.display = "block";

  step2.classList.remove(
    "show"
  );


  nextBtn.classList.remove(
    "show"
  );


  pronounOptions.innerHTML =
    "";


  taskModal.classList.add(
    "show"
  );

}


/* =========================================================
   CHECK FIRST SENTENCE
========================================================= */

check1.addEventListener(
  "click",
  () => {

    const answer =
      getAnswerText();


    const correct =
      normalize(answer)
      ===
      normalize(
        current.answer
      );


    if (!correct) {

      feedback1.textContent =
        "Check the words again.";

      feedback1.className =
        "feedback bad";

      return;

    }


    step1.style.display = "none";

showSecondStep();

  }
);


/* =========================================================
   SECOND STEP
========================================================= */

function showSecondStep() {

  step2.classList.add(
    "show"
  );


  /*
    Показываем первое предложение
    уже готовым текстом.
  */

  correctSentence.textContent =
    current.answer;


  /*
    Второе предложение уже готово.
    Ребёнок выбирает только
    his / her / their.
  */

  replaceSentence.innerHTML = `

    <span>
      ${current.demonstrative}
      is
    </span>

    <strong id="pronounSlot">
      ___
    </strong>

    <span>
      ${current.noun}.
    </span>

  `;


  const options = [
    "his",
    "her",
    "their"
  ];


  options.forEach(
    option => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "pronoun-button";

      button.textContent =
        option;


      button.addEventListener(
        "click",
        () => {

          checkPronoun(
            option,
            button
          );

        }
      );


      pronounOptions.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   PRONOUN CHECK
========================================================= */

function checkPronoun(
  selected,
  button
) {

  const buttons =
    pronounOptions
      .querySelectorAll(
        ".pronoun-button"
      );


  buttons.forEach(
    item => {

      item.classList.remove(
        "selected",
        "wrong"
      );

    }
  );


  button.classList.add(
    "selected"
  );


  const slot =
    document.getElementById(
      "pronounSlot"
    );


  if (
    selected
    ===
    current.pronoun
  ) {

    slot.textContent =
      selected;


    button.classList.add(
      "correct"
    );


    feedback2.textContent =
      "✓";

    feedback2.className =
      "feedback good";


    /*
      Показываем только
      стрелку вперёд.
    */

    nextBtn.classList.add(
      "show"
    );


    buttons.forEach(
      item => {

        item.disabled = true;

      }
    );


    return;

  }


  button.classList.add(
    "wrong"
  );


  feedback2.textContent =
    "Try again.";

  feedback2.className =
    "feedback bad";

}


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
  "click",
  () => {

    taskModal.classList.remove(
      "show"
    );


    busy = false;


    if (
      pos !== cells.length - 1
    ) {

      rollBtn.disabled =
        false;

    }


    statusEl.textContent =
      "Your turn!";

  }
);

</script>

</body>
